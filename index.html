<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Contact Page</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#2563eb);
    padding:20px;
}

.card{
    width:100%;
    max-width:420px;
    background:rgba(255,255,255,.1);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:25px;
    padding:35px;
    text-align:center;
    color:white;
    box-shadow:0 20px 50px rgba(0,0,0,.3);
}

.profile{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:IMG-20260610-WA0024.jpg
    border:4px solid white;
    margin-bottom:15px;
}

h1{
    font-size:28px;
    margin-bottom:5px;
}

.bio{
    opacity:.8;
    margin-bottom:25px;
}

.btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:15px;
    margin:12px 0;
    border-radius:15px;
    text-decoration:none;
    color:white;
    font-weight:600;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px);
}

.whatsapp{
    background:#25D366;
}

.instagram{
    background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);
}

.footer{
    margin-top:20px;
    opacity:.7;
    font-size:13px;
}
</style>
</head>
<body>

<div class="card">

<img src="https://i.imgur.com/8Km9tLL.png" class="profile">

<h1>penikmatt galauu</h1>

  <p class="bio">
Hubungi saya melalui WhatsApp atau Instagram
</p>

<a class="btn whatsapp"
href="https://wa.me/6283106138973?text=Halo%20Alif,%20saya%20ingin%20bertanya.">
💬 Chat WhatsApp
</a>

<a class="btn instagram"
href=https://www.instagram.com/penikmattgalauu?igsh=MTFzMXRsbHBqMW41bw%3D%3D&utm_source=qr
target="_blank">
📸 Instagram
</a>

<div class="footer">
© 2026 penikmatt galauu
</div>

</div>

</body>
</html>
